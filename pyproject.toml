[project]
name = "RAG"
version = "2.0"
description = "RAG against the machine, Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
exclude = ["^\\.venv/", "^data/", "^legacy/", "^datasets_public/"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
